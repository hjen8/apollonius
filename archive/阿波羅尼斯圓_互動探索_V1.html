<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阿波羅尼斯圓 - GGB 互動探索實驗室 (V1 初始版)</title>
<style>
  :root {
    --bg-color: #0f172a;
    --panel-bg: rgba(30, 41, 59, 0.85);
    --border-color: #334155;
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --color-a: #38bdf8;
    --color-b: #f87171;
    --color-p: #fbbf24;
    --color-match: #4ade80;
    --color-circle: #fb923c;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif;
    background-color: var(--bg-color);
    color: var(--text-primary);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    height: 100vh;
    width: 100vw;
  }

  header {
    padding: 12px 24px;
    background: var(--panel-bg);
    border-bottom: 1px solid var(--border-color);
    display: flex;
    justify-content: space-between;
    align-items: center;
    backdrop-filter: blur(8px);
    z-index: 10;
  }

  .title-group h1 { font-size: 1.25rem; font-weight: 700; color: #fff; letter-spacing: 0.5px; }
  .title-group p { font-size: 0.85rem; color: var(--text-secondary); margin-top: 2px; }

  .stats-bar {
    display: flex;
    gap: 16px;
    align-items: center;
  }

  .stat-card {
    background: #1e293b;
    padding: 6px 14px;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.9rem;
  }

  .stat-value { font-weight: 700; font-family: monospace; font-size: 1.1rem; }
  .ratio-badge {
    padding: 3px 8px;
    border-radius: 6px;
    font-weight: 700;
    font-size: 0.95rem;
    transition: all 0.2s ease;
  }
  .ratio-normal { background: #334155; color: #cbd5e1; }
  .ratio-hit { background: #166534; color: #4ade80; box-shadow: 0 0 12px #22c55e88; }

  #main-container {
    flex: 1;
    position: relative;
    width: 100%;
    height: 100%;
  }

  canvas {
    width: 100%;
    height: 100%;
    display: block;
    cursor: crosshair;
  }

  #toolbar {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--panel-bg);
    padding: 10px 20px;
    border-radius: 40px;
    border: 1px solid var(--border-color);
    display: flex;
    gap: 12px;
    align-items: center;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(12px);
    z-index: 10;
  }

  .btn {
    background: #334155;
    color: #f1f5f9;
    border: none;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .btn:hover { background: #475569; transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn.active { background: #2563eb; color: #fff; }

  .checkbox-label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.85rem;
    color: var(--text-secondary);
    cursor: pointer;
    padding: 0 8px;
  }
  .checkbox-label input { cursor: pointer; accent-color: #3b82f6; }

  #hint-overlay {
    position: absolute;
    top: 20px;
    left: 24px;
    background: rgba(15, 23, 42, 0.8);
    border: 1px solid var(--border-color);
    padding: 12px 18px;
    border-radius: 10px;
    max-width: 320px;
    font-size: 0.85rem;
    line-height: 1.5;
    color: #cbd5e1;
    pointer-events: none;
  }
  #hint-overlay strong { color: #fbbf24; }
</style>
</head>
<body>

<header>
  <div class="title-group">
    <h1>阿波羅尼斯圓 (Apollonius Circle) 互動探索實驗室 (V1)</h1>
    <p>拖曳動點 P，尋找所有滿足「PA : PB = 2 : 1」的神秘軌跡</p>
  </div>
  <div class="stats-bar">
    <div class="stat-card">
      <span style="color:var(--color-a);">PA 距離:</span>
      <span id="val-pa" class="stat-value">0.0</span>
    </div>
    <div class="stat-card">
      <span style="color:var(--color-b);">PB 距離:</span>
      <span id="val-pb" class="stat-value">0.0</span>
    </div>
    <div class="stat-card">
      <span>目前比值 (PA/PB):</span>
      <span id="val-ratio" class="ratio-badge ratio-normal">0.00</span>
    </div>
  </div>
</header>

<div id="main-container">
  <canvas id="canvas"></canvas>

  <div id="hint-overlay">
    💡 <strong>探索任務</strong>：<br>
    用滑鼠按住黃色動點 <strong>P</strong> 拖曳。<br>
    當比值變成 <strong>2.00 (亮綠色)</strong> 時，代表找到了一顆目標點！在不同方向繞繞看，你能猜出它最後拼出的形狀嗎？
  </div>

  <div id="toolbar">
    <label class="checkbox-label">
      <input type="checkbox" id="chk-auto-stamp" checked> 命中時自動留痕 (Trail)
    </label>
    <button class="btn" id="btn-stamp-now">🎯 蓋下目前點</button>
    <button class="btn" id="btn-scan">⚡ 密集掃描全軌跡</button>
    <button class="btn" id="btn-toggle-circle">⭕ 揭曉理論圓</button>
    <button class="btn" id="btn-clear" style="background:#7f1d1d;">🗑️ 清空足跡</button>
  </div>
</div>

<script>
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  const valPA = document.getElementById("val-pa");
  const valPB = document.getElementById("val-pb");
  const valRatio = document.getElementById("val-ratio");
  const chkAutoStamp = document.getElementById("chk-auto-stamp");
  const btnStampNow = document.getElementById("btn-stamp-now");
  const btnScan = document.getElementById("btn-scan");
  const btnToggleCircle = document.getElementById("btn-toggle-circle");
  const btnClear = document.getElementById("btn-clear");

  let width, height, originX, originY;
  const SCALE = 70;

  const mathA = { x: -2.5, y: 0 };
  const mathB = { x: 0.5, y: 0 };
  let mathP = { x: -1.0, y: 1.5 };
  let isDragging = false;
  let stampedPoints = [];
  let showTrueCircle = false;

  function resize() {
    width = canvas.width = canvas.parentElement.clientWidth;
    height = canvas.height = canvas.parentElement.clientHeight;
    originX = width / 2;
    originY = height / 2;
    draw();
  }
  window.addEventListener("resize", resize);

  function toScreen(mathPt) {
    return {
      x: originX + mathPt.x * SCALE,
      y: originY - mathPt.y * SCALE
    };
  }

  function toMath(screenPt) {
    return {
      x: (screenPt.x - originX) / SCALE,
      y: (originY - screenPt.y) / SCALE
    };
  }

  function dist(p1, p2) {
    return Math.hypot(p1.x - p2.x, p1.y - p2.y);
  }

  function update() {
    const dPA = dist(mathP, mathA);
    const dPB = dist(mathP, mathB);
    const ratio = dPB === 0 ? 999 : (dPA / dPB);

    valPA.textContent = dPA.toFixed(2);
    valPB.textContent = dPB.toFixed(2);
    valRatio.textContent = ratio.toFixed(2);

    const isHit = Math.abs(ratio - 2.0) <= 0.06;

    if (isHit) {
      valRatio.className = "ratio-badge ratio-hit";
      if (chkAutoStamp.checked) {
        const last = stampedPoints[stampedPoints.length - 1];
        if (!last || dist(last, mathP) > 0.08) {
          stampedPoints.push({ x: mathP.x, y: mathP.y });
        }
      }
    } else {
      valRatio.className = "ratio-badge ratio-normal";
    }
  }

  function draw() {
    ctx.clearRect(0, 0, width, height);

    ctx.lineWidth = 1;
    ctx.strokeStyle = "#1e293b";
    for (let x = originX % SCALE; x < width; x += SCALE) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
    }
    for (let y = originY % SCALE; y < height; y += SCALE) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
    }

    ctx.strokeStyle = "#334155";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, originY); ctx.lineTo(width, originY);
    ctx.moveTo(originX, 0); ctx.lineTo(originX, height);
    ctx.stroke();

    const scrA = toScreen(mathA);
    const scrB = toScreen(mathB);
    const scrP = toScreen(mathP);

    if (showTrueCircle) {
      const center = toScreen({ x: 1.5, y: 0 });
      ctx.beginPath();
      ctx.arc(center.x, center.y, 2.0 * SCALE, 0, 2 * Math.PI);
      ctx.strokeStyle = "rgba(251, 146, 60, 0.4)";
      ctx.lineWidth = 3;
      ctx.setLineDash([8, 6]);
      ctx.stroke();
      ctx.setLineDash([]);

      const scrC = toScreen({ x: -0.5, y: 0 });
      const scrD = toScreen({ x: 3.5, y: 0 });

      ctx.fillStyle = "#facc15";
      ctx.beginPath(); ctx.arc(scrC.x, scrC.y, 6, 0, 2*Math.PI); ctx.fill();
      ctx.fillText("內分點 C", scrC.x - 24, scrC.y + 20);

      ctx.fillStyle = "#4ade80";
      ctx.beginPath(); ctx.arc(scrD.x, scrD.y, 6, 0, 2*Math.PI); ctx.fill();
      ctx.fillText("外分點 D", scrD.x - 24, scrD.y + 20);
    }

    for (let pt of stampedPoints) {
      const scr = toScreen(pt);
      ctx.beginPath();
      ctx.arc(scr.x, scr.y, 4, 0, 2 * Math.PI);
      ctx.fillStyle = "rgba(74, 222, 128, 0.75)";
      ctx.shadowColor = "#4ade80";
      ctx.shadowBlur = 8;
      ctx.fill();
    }
    ctx.shadowBlur = 0;

    ctx.lineWidth = 2.5;
    ctx.strokeStyle = "#38bdf8";
    ctx.beginPath(); ctx.moveTo(scrP.x, scrP.y); ctx.lineTo(scrA.x, scrA.y); ctx.stroke();

    ctx.strokeStyle = "#f87171";
    ctx.beginPath(); ctx.moveTo(scrP.x, scrP.y); ctx.lineTo(scrB.x, scrB.y); ctx.stroke();

    ctx.strokeStyle = "#64748b";
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(scrA.x, scrA.y); ctx.lineTo(scrB.x, scrB.y); ctx.stroke();

    ctx.fillStyle = "#38bdf8";
    ctx.beginPath(); ctx.arc(scrA.x, scrA.y, 8, 0, 2 * Math.PI); ctx.fill();
    ctx.font = "bold 14px sans-serif";
    ctx.fillText("A (-2.5, 0)", scrA.x - 30, scrA.y + 24);

    ctx.fillStyle = "#f87171";
    ctx.beginPath(); ctx.arc(scrB.x, scrB.y, 8, 0, 2 * Math.PI); ctx.fill();
    ctx.fillText("B (0.5, 0)", scrB.x - 25, scrB.y + 24);

    const dPA = dist(mathP, mathA);
    const dPB = dist(mathP, mathB);
    const ratio = dPB === 0 ? 999 : (dPA / dPB);
    const isHit = Math.abs(ratio - 2.0) <= 0.06;

    ctx.fillStyle = isHit ? "#4ade80" : "#fbbf24";
    ctx.shadowColor = isHit ? "#4ade80" : "#fbbf24";
    ctx.shadowBlur = isHit ? 18 : 6;
    ctx.beginPath(); ctx.arc(scrP.x, scrP.y, 11, 0, 2 * Math.PI); ctx.fill();
    ctx.shadowBlur = 0;

    ctx.fillStyle = "#fff";
    ctx.font = "bold 15px sans-serif";
    ctx.fillText(`P (動點)`, scrP.x + 16, scrP.y - 12);
  }

  function onPointerDown(e) {
    const rect = canvas.getBoundingClientRect();
    const mouseScr = { x: e.clientX - rect.left, y: e.clientY - rect.top };
    const scrP = toScreen(mathP);
    if (dist(mouseScr, scrP) < 25) {
      isDragging = true;
    }
  }

  function onPointerMove(e) {
    if (!isDragging) return;
    const rect = canvas.getBoundingClientRect();
    const mouseScr = { x: e.clientX - rect.left, y: e.clientY - rect.top };
    mathP = toMath(mouseScr);
    update();
    draw();
  }

  function onPointerUp() {
    isDragging = false;
  }

  canvas.addEventListener("pointerdown", onPointerDown);
  window.addEventListener("pointermove", onPointerMove);
  window.addEventListener("pointerup", onPointerUp);

  btnStampNow.addEventListener("click", () => {
    stampedPoints.push({ x: mathP.x, y: mathP.y });
    draw();
  });

  btnClear.addEventListener("click", () => {
    stampedPoints = [];
    showTrueCircle = false;
    btnToggleCircle.classList.remove("active");
    draw();
  });

  btnToggleCircle.addEventListener("click", () => {
    showTrueCircle = !showTrueCircle;
    btnToggleCircle.classList.toggle("active", showTrueCircle);
    draw();
  });

  btnScan.addEventListener("click", () => {
    stampedPoints = [];
    const numPoints = 120;
    for (let i = 0; i < numPoints; i++) {
      const theta = (i / numPoints) * 2 * Math.PI;
      const x = 1.5 + 2.0 * Math.cos(theta);
      const y = 0.0 + 2.0 * Math.sin(theta);
      stampedPoints.push({ x, y });
    }
    showTrueCircle = true;
    btnToggleCircle.classList.add("active");
    draw();
  });

  resize();
  update();
</script>
</body>
</html>
